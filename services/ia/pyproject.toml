[project]
name = "ia"
version = "0.1.0"
description = "Único acceso al LLM: interpreta el mensaje del proveedor y redacta las respuestas del agente"
requires-python = ">=3.13"
dependencies = [
    "comun",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[tool.uv.sources]
comun = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
