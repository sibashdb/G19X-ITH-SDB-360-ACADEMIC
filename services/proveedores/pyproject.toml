[project]
name = "proveedores"
version = "0.1.0"
description = "Proveedores, contratos, historial de precios y desempeño"
requires-python = ">=3.13"
dependencies = [
    "comun",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "tzdata>=2024.1",  # base IANA para ZoneInfo en Windows e imágenes slim
]

[tool.uv.sources]
comun = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
