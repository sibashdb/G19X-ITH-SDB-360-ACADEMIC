# Publica en GHCR las seis imágenes propias de una etiqueta mvp-*, las prueba sin compilar y,
# si pasan y la etiqueta no es candidata (-rcN), mueve latest
# (docs/superpowers/specs/2026-10-28-imagenes-ghcr-design.md).
name: Imágenes

on:
  push:
    tags: ["mvp-*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta existente que se vuelve a publicar (por ejemplo, mvp-1.2)"
        required: true

permissions:
  contents: read

env:
  ETIQUETA: ${{ github.event_name == 'push' && github.ref_name || inputs.etiqueta }}

concurrency:
  group: imagenes-${{ github.event_name == 'push' && github.ref_name || inputs.etiqueta }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: proveedores
            dockerfile: services/proveedores/Dockerfile
          - servicio: administracion
            dockerfile: services/administracion/Dockerfile
          - servicio: inteligencia
            dockerfile: services/inteligencia/Dockerfile
          - servicio: ia
            dockerfile: services/ia/Dockerfile
          - servicio: negociacion
            dockerfile: services/negociacion/Dockerfile
          - servicio: gateway
            dockerfile: web/Dockerfile
    steps:
      # Antes de publicar nada: una etiqueta mal formada (mvp-1.2.1, main) o anterior al
      # entregable 5 (mvp-1.1, cuyo arrancar.py compila en lugar de descargar) haría que probar
      # «pasara» sin probar lo publicado y que latest se moviera a algo sin probar.
      - name: Etiqueta válida
        run: |
          if [[ ! "$ETIQUETA" =~ ^mvp-[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::La etiqueta debe ser como mvp-1.2 o mvp-1.2-rc1: $ETIQUETA"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.ETIQUETA }}
      - name: La etiqueta ya publica imágenes
        run: |
          grep -q PLURIONE_VERSION infra/docker-compose.yml || {
            echo "::error::$ETIQUETA es anterior al entregable 5: no publica imágenes"
            exit 1
          }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # git: la revisión es el commit de la etiqueta, también al publicar a mano.
          context: git
          images: ghcr.io/sibashdb/g19x-ith-sdb-360-academic/${{ matrix.servicio }}
          tags: type=raw,value=${{ env.ETIQUETA }}
          flavor: latest=false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # Lo publicado, sin compilar: arrancar.py --imagenes descarga, levanta, importa y corre la
  # prueba de humo. Inicia sesión para no depender de que los paquetes ya sean públicos.
  probar:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.ETIQUETA }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.20"
      - run: uv sync --all-packages --locked --no-build
      - run: uv run --locked --no-build python infra/arrancar.py --imagenes "$ETIQUETA"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

  # latest solo apunta a una versión que pasó la prueba de humo, y nunca a una candidata.
  latest:
    needs: probar
    if: ${{ !contains(github.ref_name, '-rc') && !contains(inputs.etiqueta, '-rc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for servicio in proveedores administracion inteligencia ia negociacion gateway; do
            imagen="ghcr.io/sibashdb/g19x-ith-sdb-360-academic/$servicio"
            docker buildx imagetools create --tag "$imagen:latest" "$imagen:$ETIQUETA"
          done
