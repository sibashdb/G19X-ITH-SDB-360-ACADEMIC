name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages --locked
      - run: cp infra/.env.example infra/.env
      - run: uv run python -m generador --salida datos
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300
      - run: docker compose -f infra/docker-compose.yml exec -T proveedores python -m proveedores.importacion.cli /datos
      - run: uv run python infra/smoke_test.py
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action consulta los commits del PR (API); el permiso global contents: read no basta en repos privados.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo se exige si el repositorio pertenece a una organización; inocuo en una cuenta personal.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
