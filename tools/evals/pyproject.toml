[project]
name = "evals"
version = "0.1.0"
description = "Evals del LLM de la negociación: mensajes etiquetados, ataques y latencia (PRD §4.8)"
requires-python = ">=3.13"
dependencies = ["ia", "negociacion", "httpx>=0.28"]

[tool.uv.sources]
ia = { workspace = true }
negociacion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
