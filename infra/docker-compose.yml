name: plataforma

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
      PROVEEDORES_DB_PASSWORD: ${PROVEEDORES_DB_PASSWORD:?Defina PROVEEDORES_DB_PASSWORD en infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD en infra/.env}
      ADMINISTRACION_DB_PASSWORD: ${ADMINISTRACION_DB_PASSWORD:?Defina ADMINISTRACION_DB_PASSWORD en infra/.env}
      ADMINISTRACION_DUENO_DB_PASSWORD: ${ADMINISTRACION_DUENO_DB_PASSWORD:?Defina ADMINISTRACION_DUENO_DB_PASSWORD en infra/.env}
      INTELIGENCIA_DB_PASSWORD: ${INTELIGENCIA_DB_PASSWORD:?Defina INTELIGENCIA_DB_PASSWORD en infra/.env}
      INTELIGENCIA_DUENO_DB_PASSWORD: ${INTELIGENCIA_DUENO_DB_PASSWORD:?Defina INTELIGENCIA_DUENO_DB_PASSWORD en infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-bases.sh:ro
      - ./postgres/administracion.sh:/docker-entrypoint-initdb.d/20-administracion.sh:ro
      - ./postgres/inteligencia.sh:/docker-entrypoint-initdb.d/30-inteligencia.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # Nombre de nodo estable: sin esto RabbitMQ usa el id del contenedor y pierde su mnesia al recrearlo.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: plataforma
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en infra/.env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq-topologia:
    image: curlimages/curl:8.11.1
    # Declara colas, enlaces y colas de fallidos antes de que alguien publique. La API de
    # administración fusiona: no borra nada ni toca los usuarios. Aplicarla de nuevo no cambia nada.
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -fsS --retry 20 --retry-delay 3 --retry-all-errors
        -u "plataforma:$${RABBITMQ_PASSWORD}" -H "content-type: application/json"
        -X POST --data-binary @/definitions.json http://rabbitmq:15672/api/definitions
    depends_on:
      rabbitmq:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD en infra/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMINISTRACION_SECRET: ${KEYCLOAK_ADMINISTRACION_SECRET:?Defina KEYCLOAK_ADMINISTRACION_SECRET en infra/.env}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes/plataforma:/opt/keycloak/themes/plataforma:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se consulta el documento de descubrimiento del realm con bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /auth/realms/plataforma/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q issuer <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  proveedores:
    build:
      context: ..
      dockerfile: services/proveedores/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://proveedores:${PROVEEDORES_DB_PASSWORD}@postgres:5432/proveedores_db
      RABBITMQ_URL: amqp://plataforma:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OIDC_ISSUER: http://localhost:8080/auth/realms/plataforma
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/plataforma/protocol/openid-connect/certs
      ROOT_PATH: /api/proveedores
    volumes:
      - ../datos:/datos:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-topologia:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/listo', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  administracion:
    build:
      context: ..
      dockerfile: services/administracion/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://administracion:${ADMINISTRACION_DB_PASSWORD}@postgres:5432/administracion_db
      DATABASE_URL_MIGRACIONES: postgresql+asyncpg://administracion_dueno:${ADMINISTRACION_DUENO_DB_PASSWORD}@postgres:5432/administracion_db
      RABBITMQ_URL: amqp://plataforma:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OIDC_ISSUER: http://localhost:8080/auth/realms/plataforma
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/plataforma/protocol/openid-connect/certs
      ROOT_PATH: /api/administracion
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_SECRETO: ${KEYCLOAK_ADMINISTRACION_SECRET:?Defina KEYCLOAK_ADMINISTRACION_SECRET en infra/.env}
      URL_APP: http://localhost:8080/
      BUZON_URL: http://localhost:8025
      PROVEEDORES_URL: http://proveedores:8000
      INTELIGENCIA_URL: http://inteligencia:8000
      MAILPIT_URL: http://mailpit:8025
      RABBITMQ_API_URL: http://rabbitmq:15672/api
      VERSION_APP: ${VERSION_APP:-desarrollo}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-topologia:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/listo', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  inteligencia:
    build:
      context: ..
      dockerfile: services/inteligencia/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://inteligencia:${INTELIGENCIA_DB_PASSWORD}@postgres:5432/inteligencia_db
      DATABASE_URL_MIGRACIONES: postgresql+asyncpg://inteligencia_dueno:${INTELIGENCIA_DUENO_DB_PASSWORD}@postgres:5432/inteligencia_db
      RABBITMQ_URL: amqp://plataforma:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OIDC_ISSUER: http://localhost:8080/auth/realms/plataforma
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/plataforma/protocol/openid-connect/certs
      ROOT_PATH: /api/inteligencia
      DIRECTORIO_MODELOS: /modelos
    volumes:
      - modelos:/modelos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-topologia:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/listo', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.30
    # Buzón de desarrollo: Keycloak le entrega los correos por SMTP (solo red interna, puerto 1025);
    # la interfaz web queda solo en este equipo.
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    # restart: true reinicia el gateway cuando se recrea una dependencia; Nginx resuelve las IP
    # de los servicios una sola vez al arrancar y, sin esto, daría 502 con IP viejas.
    depends_on:
      proveedores:
        condition: service_healthy
        restart: true
      administracion:
        condition: service_healthy
        restart: true
      inteligencia:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true

volumes:
  pgdata:
  rabbitdata:
  modelos:
