limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Conserva el X-Request-ID del cliente o genera uno nuevo.
map $http_x_request_id $id_peticion {
    ""      $request_id;
    default $http_x_request_id;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # El gateway es el borde: el cliente no elige la IP que registra la bitácora.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $id_peticion;

    # Errores generados por el propio gateway, en Problem Details (RFC 9457) y en español.
    # Los errores que devuelven los servicios se reenvían tal cual (proxy_intercept_errors off).
    error_page 413 = @error_413;
    error_page 429 = @error_429;
    error_page 502 = @error_502;
    error_page 503 = @error_503;
    error_page 504 = @error_504;

    location @error_413 {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Contenido demasiado grande","status":413,"detail":"El archivo excede el límite de 10 MB."}';
    }

    location @error_429 {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Demasiadas solicitudes","status":429,"detail":"Espere unos segundos e intente de nuevo."}';
    }

    location @error_502 {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 502 '{"type":"about:blank","title":"Servicio no disponible","status":502,"detail":"El servicio no está disponible; intente más tarde."}';
    }

    location @error_503 {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"about:blank","title":"Servicio no disponible","status":503,"detail":"El servicio no está disponible; intente más tarde."}';
    }

    location @error_504 {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 504 '{"type":"about:blank","title":"Servicio no disponible","status":504,"detail":"El servicio no está disponible; intente más tarde."}';
    }

    # Rutas de API desconocidas (con o sin barra final): que no caigan en index.html de la SPA.
    location /api/ {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 404 '{"type":"about:blank","title":"No encontrado","status":404,"detail":"El recurso solicitado no existe."}';
    }

    location = /api {
        default_type application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 404 '{"type":"about:blank","title":"No encontrado","status":404,"detail":"El recurso solicitado no existe."}';
    }

    location /api/proveedores/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://proveedores:8000/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location /api/administracion/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://administracion:8000/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location /api/inteligencia/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://inteligencia:8000/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location /api/negociacion/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://negociacion:8000/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # Keycloak envía sus propias cabeceras de seguridad para sus páginas.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
