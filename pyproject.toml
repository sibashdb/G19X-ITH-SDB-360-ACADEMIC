[project]
name = "plataforma-negociacion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "comun",
    "administracion",
    "inteligencia",
    "negociacion",
    "proveedores",
    "generador",
    "simulador",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "testcontainers[postgres,rabbitmq]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.120",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[tool.uv.sources]
comun = { workspace = true }
administracion = { workspace = true }
inteligencia = { workspace = true }
negociacion = { workspace = true }
proveedores = { workspace = true }
generador = { workspace = true }
simulador = { workspace = true }
ia = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tools"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integracion: requiere Docker (Testcontainers)"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead",
    # testcontainers (RabbitMqContainer) usa su propio decorador obsoleto al importarse.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = [
    "comun",
    "proveedores",
    "generador",
    "administracion",
    "inteligencia",
    "negociacion",
    "simulador",
    "ia",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = [
    "comun",
    "proveedores",
    "generador",
    "administracion",
    "inteligencia",
    "negociacion",
    "simulador",
    "ia",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "scipy.*"]
ignore_missing_imports = true
